services:
  web:
    build: .
    ports: ["8080:80"]
    volumes: ["./src:/var/www/html"]
    depends_on: [db]
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: loja
  phpmyadmin:
    image: phpmyadmin:5
    environment: { PMA_HOST: db }
    ports: ["8081:80"]
